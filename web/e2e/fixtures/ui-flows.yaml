# Tests for the run flows the browser tests watch (web/e2e/flows.spec.ts),
# applied by test/e2e/run.sh: one that queues behind itself
# (concurrencyPolicy: Forbid), one that fans out into workers.
apiVersion: tests.kubetest.io/v1alpha1
kind: Test
metadata:
  name: ui-forbid
  labels:
    app.kubernetes.io/managed-by: ui
    kubetest.io/tool: busybox
spec:
  concurrencyPolicy: Forbid
  container:
    image: busybox:1.37
    command: ["sh", "-c"]
    args: ["echo working; sleep 15; echo done"]
---
apiVersion: tests.kubetest.io/v1alpha1
kind: Test
metadata:
  name: ui-parallel
  labels:
    app.kubernetes.io/managed-by: ui
    kubetest.io/tool: busybox
spec:
  container:
    image: busybox:1.37
    command: ["sh", "-c"]
    args:
      [
        "echo worker $KUBETEST_WORKER_INDEX of {{ worker.count }} says {{ matrix.greeting }} to $(cat $KUBETEST_DATADIR/repo/who.txt); sleep 3",
      ]
  content:
    files:
      - path: who.txt
        content: "the e2e"
  parallel:
    matrix:
      greeting: [hello, hi, hey]
