apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/managed-by: kubetest-alt
    kubetest.io/run-id: sample-minio-run
  name: sample-minio-run
  namespace: kubetest-samples
  ownerReferences:
  - apiVersion: tests.kubetest.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: TestRun
    name: sample-minio-run
    uid: 00000000-0000-0000-0000-0000cafe0001
spec:
  activeDeadlineSeconds: 360
  backoffLimit: 0
  template:
    metadata:
      annotations:
        foo/bar: baz
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/managed-by: kubetest-alt
        kubetest.io/run-id: sample-minio-run
        team: sre
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - run
        - --summary-export=summary.json
        - script.js
        command:
        - /entry
        env:
        - name: KUBETEST_DATADIR
          value: /data
        - name: KUBETEST_RESULTDIR
          value: /etc/kubetest/result
        - name: KUBETEST_RUN_ID
          value: sample-minio-run
        - name: KUBETEST_TEST_REF
          value: sample-minio
        - name: MINIO_ENDPOINT
          value: minio.kubetest.svc:9000
        - name: MINIO_BUCKET
          value: kubetest-artifacts
        - name: FEATURE_X
          value: "on"
        envFrom:
        - secretRef:
            name: kubetest-minio-creds
        image: grafana/k6:2.2.0
        name: wrapper
        resources: {}
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /etc/kubetest
          name: request
          readOnly: true
        - mountPath: /etc/kubetest/result
          name: result
      initContainers:
      - command:
        - /entry
        - fetch
        env:
        - name: KUBETEST_DATADIR
          value: /data
        image: ghcr.io/hinskii/kubetest-alt/content-fetcher:v0.0.0
        name: content-fetcher
        resources: {}
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /etc/kubetest
          name: request
          readOnly: true
      restartPolicy: Never
      terminationGracePeriodSeconds: 45
      volumes:
      - emptyDir: {}
        name: data
      - emptyDir: {}
        name: result
      - configMap:
          items:
          - key: request.json
            path: request.json
          - key: content.json
            path: content.json
          name: sample-minio-run-request
        name: request
  ttlSecondsAfterFinished: 3600
status: {}
---
apiVersion: v1
data:
  content.json: '{"git":{"uri":"https://example.com/tests.git","revision":"main"}}'
  request.json: |-
    {
      "type": "k6",
      "runId": "sample-minio-run",
      "testRef": "sample-minio",
      "dataDir": "/data",
      "args": [
        "run",
        "--summary-export=summary.json",
        "script.js"
      ],
      "env": {
        "FEATURE_X": "on"
      },
      "config": {
        "vus": "10"
      },
      "artifacts": {
        "paths": [
          "results/**/*.xml"
        ]
      },
      "timeoutSeconds": 300
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: kubetest-alt
    kubetest.io/run-id: sample-minio-run
  name: sample-minio-run-request
  namespace: kubetest-samples
  ownerReferences:
  - apiVersion: tests.kubetest.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: TestRun
    name: sample-minio-run
    uid: 00000000-0000-0000-0000-0000cafe0001
