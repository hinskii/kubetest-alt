config:
  target: http://target:8000
  spiderMinutes: "1"
expect:
  phase: failed            # a bare python server misses security headers → WARN
  # Alert counts depend on the target and ZAP's rule set: assert they're
  # reported, not their values (pkg/report fixtures pin the parser).
  metricsPresent: [alerts_high, alerts_medium, alerts_low, alerts_info, alerts_total]
  artifacts: ["repo/results/zap-report.*"]
  report: true
timeout: 15m
