config:
  script: k6/script.js
  dashboardPeriod: 1s      # the run lasts ~3s; the report needs two periods
expect:
  phase: passed            # no thresholds → exit 0 even with failed checks
  metrics: {requests: 40, errors: 20, error_rate: 0.5, checks_passed: 20, checks_failed: 20}
  metricsPresent: [rps, latency_avg_ms, latency_p95_ms]
  artifacts: ["repo/results/summary.json"]
  report: true
