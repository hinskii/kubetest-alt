name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        # test-coverage runs `make test`, then enforces the per-package
        # COVERAGE_PKGS floors (unenforced in CI until now).
        run: |
          go mod tidy
          make test-coverage

      - name: Build
        run: make build

  web:
    permissions:
      contents: read
    # Control Center's React UI (web/): types, lint, tests, build. pnpm's
    # version comes from package.json (packageManager) through corepack.
    name: Control Center UI
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: make web-install

      - name: API types match the spec
        run: make web-gen-api-check

      - name: Typecheck, lint, test, build
        run: |
          make web-typecheck
          make web-lint
          make web-test
          make web-build

      - name: Bundle budget
        run: make web-size

      - name: Dependency audit and licenses
        run: |
          make web-audit
          make web-licenses

  integration:
    permissions:
      contents: read
    # Real Postgres (run history) and real object stores — MinIO for the S3
    # backend, fake-gcs-server for the GCS backend — via testcontainers.
    name: Integration (Postgres, S3, GCS)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: make test-coverage-integration
