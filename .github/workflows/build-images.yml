name: Build images

# The platform's images, built once per workflow run and handed to every
# kind job as an artifact (step 21 F1): before, each of the 2 E2E and 15
# Catalog jobs built the same images itself, ~5–6 minutes each. Layers are
# cached in GitHub Actions' cache (one scope per image); within this job
# the Go builds share BuildKit cache mounts (see the Dockerfiles).
#
# The names and tags are test/e2e/run.sh's IMAGES; run.sh still checks
# that each one is there, so a mismatch fails loudly.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: e2e-local
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfiles' cache mounts (Go modules, Go's build cache, pnpm's
      # store) live in the builder and start empty on every runner; the
      # first Go image then compiled every dependency (~2 min). They're
      # kept in GitHub Actions' cache and injected into the builder.
      # The key follows everything the builds compile: unchanged → a hit,
      # nothing was compiled, saving is skipped; changed → the newest cache
      # is restored (restore-keys), the build compiles only what changed,
      # and the result is saved. What was injected comes back out with
      # it, so a run that compiles nothing can't empty the cache.
      - name: Cache mounts
        id: mounts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-mount
          key: buildkit-mounts-${{ hashFiles('go.sum', '**/*.go', 'web/pnpm-lock.yaml', 'Dockerfile', 'executors/content-fetcher/Dockerfile') }}
          restore-keys: buildkit-mounts-

      - name: Inject the cache mounts into the builder
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "cache-mount/gomod": { "target": "/go/pkg/mod", "id": "gomod" },
              "cache-mount/gobuild": { "target": "/root/.cache/go-build", "id": "gobuild" },
              "cache-mount/pnpm-store": { "target": "/root/.local/share/pnpm/store", "id": "pnpm-store" }
            }
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}

      - name: operator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: TARGET_BIN=cmd/operator
          tags: kubetest-alt/operator:${{ env.TAG }}
          load: true
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

      - name: apiserver
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: TARGET_BIN=cmd/apiserver
          tags: kubetest-alt/apiserver:${{ env.TAG }}
          load: true
          cache-from: type=gha,scope=apiserver
          cache-to: type=gha,mode=max,scope=apiserver

      - name: control-center
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            TARGET_BIN=cmd/control-center
            WITH_WEB=true
          tags: kubetest-alt/control-center:${{ env.TAG }}
          load: true
          cache-from: type=gha,scope=control-center
          cache-to: type=gha,mode=max,scope=control-center

      - name: content-fetcher
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: executors/content-fetcher/Dockerfile
          tags: kubetest-alt/content-fetcher:${{ env.TAG }}
          load: true
          cache-from: type=gha,scope=content-fetcher
          cache-to: type=gha,mode=max,scope=content-fetcher

      - name: oauth2-proxy (the chart's version, re-tagged)
        run: |
          set -euo pipefail
          img="quay.io/oauth2-proxy/oauth2-proxy:$(sed -n 's/^    tag: "\(v7[^"]*\)".*/\1/p' charts/kubetest-alt/values.yaml)"
          docker pull "$img"
          docker tag "$img" "kubetest-alt/oauth2-proxy:${TAG}"

      - name: Save
        run: |
          set -euo pipefail
          docker save \
            "kubetest-alt/operator:${TAG}" "kubetest-alt/apiserver:${TAG}" \
            "kubetest-alt/control-center:${TAG}" "kubetest-alt/content-fetcher:${TAG}" \
            "kubetest-alt/oauth2-proxy:${TAG}" | zstd -T0 -3 -o images.tar.zst
          ls -lh images.tar.zst

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-images
          path: images.tar.zst
          retention-days: 1
          compression-level: 0
