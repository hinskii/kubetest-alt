---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: webhooks.tests.kubetest.io
spec:
  group: tests.kubetest.io
  names:
    kind: Webhook
    listKind: WebhookList
    plural: webhooks
    singular: webhook
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.lastDeliveryOutcome
      name: Last
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Webhook is a single outbound delivery destination. Multiple Webhooks
          stack — every subscriber matching the run's event gets its own
          delivery attempt.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WebhookSpec describes an outbound webhook destination.

              The dispatcher picks up subscribers per event and delivers ASYNC —
              endpoint latency never delays a reconcile. Retries with capped
              exponential backoff on 5xx / connection errors; 4xx is permanent
              (never retried; the endpoint is telling us NOT to try again).
            properties:
              events:
                description: |-
                  Events filters which lifecycle transitions the dispatcher delivers.
                  Empty = deliver every terminal transition. Enum values match the
                  TestRun.Status.Phase strings so consumers speak one dialect.
                items:
                  enum:
                  - queued
                  - running
                  - paused
                  - passed
                  - failed
                  - aborted
                  - error
                  type: string
                type: array
              headers:
                description: |-
                  Headers to attach to every outbound POST. Value can come inline
                  or from a Secret via valueFrom.secretKeyRef. Secret-sourced values
                  are redacted in dispatcher logs.
                items:
                  description: |-
                    WebhookHeader carries one HTTP header for outbound delivery. Values may
                    come inline (Value, plaintext) or from a Secret (ValueFrom.SecretKeyRef).
                    Any header sourced from a secret is REDACTED in every log line the
                    dispatcher emits — see internal/webhookdelivery. Prefer ValueFrom for
                    bearer tokens, HMAC secrets, and anything else the operator should not
                    be able to spill into stdout.
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                    valueFrom:
                      description: EnvVarSource represents a source for the value
                        of an EnvVar.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              maxRetries:
                description: |-
                  MaxRetries bounds the retry count on 5xx / connection errors. 0
                  defaults to 5. 4xx responses are ALWAYS permanent regardless of
                  this value.
                format: int32
                maximum: 10
                minimum: 0
                type: integer
              timeoutSeconds:
                description: |-
                  TimeoutSeconds bounds each HTTP request (client-side deadline). 0
                  defaults to 10s. Also bounds each retry attempt.
                format: int32
                maximum: 120
                minimum: 0
                type: integer
              url:
                description: URL is the HTTP endpoint to POST payloads to. Required.
                type: string
            required:
            - url
            type: object
          status:
            description: |-
              WebhookStatus tracks last-delivery outcomes for observability. Populated
              by the dispatcher.
            properties:
              deliveriesTotal:
                description: |-
                  DeliveriesTotal / FailuresTotal are simple counters for at-a-glance
                  health. Real observability lives in Prometheus (webhook_deliveries_total).
                format: int64
                type: integer
              failuresTotal:
                format: int64
                type: integer
              lastDeliveryAt:
                description: |-
                  LastDeliveryAt is the wall-clock time of the most recent HTTP
                  attempt (regardless of outcome).
                format: date-time
                type: string
              lastDeliveryOutcome:
                description: |-
                  LastDeliveryOutcome is one of "success", "failed", "no-retry-4xx",
                  "timeout". Empty until the first delivery.
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
