# k6 load test template.
#
# Verdict: exit code (honest — 0 pass, 99 thresholds not met, other
# non-zero for script bugs). Loses the failed-vs-error split for script
# crashes (107/108 → phase=failed instead of error); acceptable trade-off
# per CLAUDE.md §15.2.
#
# Smoke verified: pass=0 / fail=99 on grafana/k6:1.4.0 (arm64, k6 v1.4.0).
apiVersion: tests.kubetest.io/v1alpha1
kind: TestTemplate
metadata:
  name: k6
  labels:
    kubetest.io/tool: k6
    app.kubernetes.io/name: kubetest-alt
spec:
  container:
    # Pinned to the version smoked at commit time. Users overlay
    # `container.image` on their Test to bump.
    image: grafana/k6:1.4.0
    command: ["k6"]
    # --summary-export feeds spec.metrics. k6 silently skips it when the
    # directory is missing; the wrapper pre-creates repo/results/.
    args: ["run", "--summary-export", "/data/repo/results/summary.json", "/data/repo/{{ config.script }}"]
  # Artifact/metrics paths are relative to the wrapper's working
  # directory, /data (no container.workingDir set), and the tool writes
  # under /data/repo/results — hence the repo/ prefix. The wrapper
  # pre-creates repo/results/ before the tool starts.
  artifacts:
    # Includes the summary.json written by --summary-export above.
    paths:
      - "repo/results/**/*.json"
      - "repo/results/**/*.xml"
  # Load metrics (docs/metrics.md) — parsed by /entry after the tool exits;
  # never affects the verdict.
  metrics:
    from: k6Summary
    path: "repo/results/summary.json"
  config:
    script:
      type: string
      # Required — every k6 Test names its own script.
      # Empty default = required per step-13 semantics.
