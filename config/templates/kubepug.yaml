# kubepug — Kubernetes API deprecation scanner template.
#
# Verdict: exit code (honest ONLY when --error-on-deprecated /
# --error-on-deleted flags are set — without them, kubepug always
# returns exit 0 even when finding deprecated APIs).
#
# Template ALWAYS passes both flags. Consumers who want a "report but
# don't fail" run override container.args per-Test.
#
# Mini-15B closing: this template used to point at
# kubeshop/testkube-kubepug-executor:2.1.123 — a testkube-vendored
# image with their own wrapper (kubepug lived at /.kubepug//kubepug,
# a vendor-specific layout). Coupling to another test platform's image
# is a smell. kubepug is a single Go binary published as a GitHub
# release tarball, so we bundle it ourselves on alpine — trivial
# image (executors/kubepug/Dockerfile) with `kubepug` on PATH.
#
# Smoke verified: pass=0 (current API) / fail=1 (policy/v1beta1 PDB) on
# kubetest-alt-kubepug:1.7.1 (arm64 native).
apiVersion: tests.kubetest.io/v1alpha1
kind: TestTemplate
metadata:
  name: kubepug
  labels:
    kubetest.io/tool: kubepug
    app.kubernetes.io/name: kubetest-alt
spec:
  container:
    # Platform-built (executors/kubepug/Dockerfile). Alpine + kubepug
    # v1.7.1 binary on /usr/local/bin/kubepug (on PATH).
    image: ghcr.io/hinskii/kubetest-alt/kubepug:1.7.1
    command: ["kubepug"]
    args:
      - "--input-file"
      - "/data/repo/{{ config.inputFile }}"
      - "--error-on-deprecated"
      - "--error-on-deleted"
      - "--format"
      - "json"
      - "--filename"
      - "/data/repo/results/kubepug-report.json"
  # Artifact/metrics paths are relative to the wrapper's working
  # directory, /data (no container.workingDir set), and the tool writes
  # under /data/repo/results — hence the repo/ prefix. The wrapper
  # pre-creates repo/results/ before the tool starts.
  artifacts:
    paths:
      - "repo/results/**/kubepug-report.*"
  # Findings → status.metrics (deprecated_apis, deleted_apis, affected_objects).
  metrics:
    from: kubepugJson
    path: "repo/results/kubepug-report.json"
  config:
    inputFile:
      type: string
      # The main path, a file: from git (required) or inline (the first file). No default (steps 20h, 20i).
      path: file
      description: "The Kubernetes manifest(s) to scan, relative to the repository root. With inline files, the first file unless set."
