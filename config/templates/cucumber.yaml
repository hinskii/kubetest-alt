# Cucumber (BDD, cucumber-ruby) template.
#
# Verdict: exit code (honest). cucumber-ruby returns 0 on all-pass,
# non-zero (typically 1) on any step failure or step definition error.
#
# No public standalone cucumber image ships on Docker Hub, so this
# template installs cucumber-ruby on top of the ruby:3.3-slim base
# on every run (same pattern as pytest). Slow first-boot; acceptable
# for MVP. Alternative for JVM-based cucumber setups: use the maven
# or gradle template with cucumber-jvm deps in the pom/build.
#
# Smoke verified: pass=0 / fail=1 on ruby:3.3-slim + cucumber 9.2.0 (arm64).
apiVersion: tests.kubetest.io/v1alpha1
kind: TestTemplate
metadata:
  name: cucumber
  labels:
    kubetest.io/tool: cucumber
    app.kubernetes.io/name: kubetest-alt
spec:
  container:
    image: ruby:3.3-slim
    command: ["sh", "-c"]
    args:
      - "gem install --quiet cucumber -v {{ config.cucumberVersion }} && cd /data/repo/{{ config.featuresDir }} && cucumber --format junit --out /data/repo/results/"
  # Artifact/metrics paths are relative to the wrapper's working
  # directory, /data (no container.workingDir set), and the tool writes
  # under /data/repo/results — hence the repo/ prefix. The wrapper
  # pre-creates repo/results/ before the tool starts.
  artifacts:
    paths:
      - "repo/results/**/*.xml"
      - "repo/results/**/*.json"
  config:
    featuresDir:
      type: string
      # Required, no default: a Test says where its files are (step 20h).
      description: "The directory with the features and step definitions, relative to the repository root (git) or to /data/repo (inline files); \".\" for the root itself."
    cucumberVersion:
      type: string
      default: "9.2.0"
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
