# OWASP ZAP baseline scan template.
#
# Verdict: exit code (honest). zap-baseline.py exit codes:
#   * 0 = no WARN, no FAIL (or -I flag set and no FAIL)
#   * 1 = at least one WARN raised
#   * 2 = at least one FAIL raised
#   * 3 = any other error
# All non-zero maps to phase=failed via default rule.
#
# `failOnWarn` (default true) controls the strictness:
#   * true  → omit -I; WARNs raise exit 1
#   * false → pass -I; only FAILs raise exit 2
#
# Verified as shipped by the catalog e2e (test/catalog/cases/zap-baseline):
# a bare HTTP server misses security headers → WARN → phase=failed, with
# the XML/JSON/HTML reports scraped. (An earlier plain-docker smoke run
# without the report options missed that they need /zap/wrk mounted.)
apiVersion: tests.kubetest.io/v1alpha1
kind: TestTemplate
metadata:
  name: zap-baseline
  labels:
    kubetest.io/tool: zap-baseline
    app.kubernetes.io/name: kubetest-alt
spec:
  container:
    # Pinned (was :stable, which moves silently); 2.17.0 == stable on 2026-10-06.
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    # `zap-baseline.py` is on PATH inside the zaproxy image.
    command: ["zap-baseline.py"]
    args:
      - "-t"
      - "{{ config.target }}"
      - "-m"
      - "{{ config.spiderMinutes }}"
      # Relative to /zap/wrk — see the volumeMounts note below.
      - "-x"
      - "repo/results/zap-report.xml"
      - "-J"
      - "repo/results/zap-report.json"
      - "-r"
      - "repo/results/zap-report.html"
    # Note: this template does NOT include -I. Consumers who want the
    # lenient policy (only FAILs raise exit) override container.args
    # per-Test — that's the escape hatch for the failOnWarn=false case.
    # A per-Test override is louder than a template flag; the boolean
    # `failOnWarn` config below is a doc marker for the intent, but
    # actual behavior comes from what args the resolved container runs.
    #
    # zap-baseline.py refuses any report option unless /zap/wrk is a
    # mounted directory ("A file based option has been specified but the
    # directory '/zap/wrk' is not mounted" → usage, exit 3), and it writes
    # reports to /zap/wrk/<name> even when <name> is absolute. So the pod's
    # data volume (the one mounted at /data — named "data" by the
    # compiler) is mounted at /zap/wrk too: /zap/wrk/repo/results/… IS
    # /data/repo/results/…, where the scraper looks.
    volumeMounts:
      - name: data
        mountPath: /zap/wrk
  # Artifact/metrics paths are relative to the wrapper's working
  # directory, /data (no container.workingDir set), and the tool writes
  # under /data/repo/results — hence the repo/ prefix. The wrapper
  # pre-creates repo/results/ before the tool starts.
  artifacts:
    paths:
      - "repo/results/**/zap-report.*"
  # Alert types by risk → status.metrics (alerts_high/medium/low/info/total).
  metrics:
    from: zapJson
    path: "repo/results/zap-report.json"
  config:
    target:
      type: string
      # Required — URL under scan (e.g. https://staging.example.com).
    spiderMinutes:
      type: integer
      default: "1"
    failOnWarn:
      # Doc marker — see the note above. When "false", consumers should
      # ALSO override container.args per-Test to include "-I".
      type: boolean
      default: "true"
