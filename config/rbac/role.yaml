---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tests.kubetest.io
  resources:
  - testruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tests.kubetest.io
  resources:
  - testruns/finalizers
  verbs:
  - update
- apiGroups:
  - tests.kubetest.io
  resources:
  - testruns/status
  - testtriggers/status
  - webhooks/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - tests.kubetest.io
  resources:
  - tests
  - testtemplates
  - webhooks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tests.kubetest.io
  resources:
  - testtriggers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
