# Sample maven Test — runs the same project the catalog e2e verifies
# (test/catalog/cases/maven/repo), sparse-checked out of this repository. It talks to the
# `target` service from target/target.yaml in the same namespace and
# includes deliberate failures; expected phase: failed.
# Swap content.git for your own repository to run real tests.
apiVersion: tests.kubetest.io/v1alpha1
kind: Test
metadata:
  name: sample-maven
spec:
  config:
    projectDir:
      default: test/catalog/cases/maven/repo/app
      type: string
  content:
    git:
      paths:
      - test/catalog/cases/maven/repo
      revision: main
      uri: https://github.com/hinskii/kubetest-alt.git
  use:
  - maven
