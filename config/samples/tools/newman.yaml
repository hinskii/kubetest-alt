# Sample newman Test — runs the same project the catalog e2e verifies
# (test/catalog/cases/newman/repo), sparse-checked out of this repository. It talks to the
# `target` service from target/target.yaml in the same namespace and
# includes deliberate failures; expected phase: failed.
# Swap content.git for your own repository to run real tests.
apiVersion: tests.kubetest.io/v1alpha1
kind: Test
metadata:
  name: sample-newman
spec:
  config:
    collection:
      default: test/catalog/cases/newman/repo/newman/collection.json
      type: string
  content:
    git:
      paths:
      - test/catalog/cases/newman/repo
      revision: main
      uri: https://github.com/hinskii/kubetest-alt.git
  use:
  - newman
