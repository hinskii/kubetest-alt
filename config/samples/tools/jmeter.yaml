# Sample jmeter Test — runs the same project the catalog e2e verifies
# (test/catalog/cases/jmeter/repo), sparse-checked out of this repository. It talks to the
# `target` service from target/target.yaml in the same namespace and
# includes deliberate failures; expected phase: failed.
# Swap content.git for your own repository to run real tests.
apiVersion: tests.kubetest.io/v1alpha1
kind: Test
metadata:
  name: sample-jmeter
spec:
  config:
    plan:
      default: test/catalog/cases/jmeter/repo/jmeter/plan.jmx
      type: string
  content:
    git:
      paths:
      - test/catalog/cases/jmeter/repo
      revision: main
      uri: https://github.com/hinskii/kubetest-alt.git
  use:
  - jmeter
