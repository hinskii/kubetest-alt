# Sample locust Test — runs the same project the catalog e2e verifies
# (test/catalog/cases/locust/repo), sparse-checked out of this repository. It talks to the
# `target` service from target/target.yaml in the same namespace and
# includes deliberate failures; expected phase: failed.
# Swap content.git for your own repository to run real tests.
apiVersion: tests.kubetest.io/v1alpha1
kind: Test
metadata:
  name: sample-locust
spec:
  config:
    duration:
      default: 5s
      type: string
    host:
      default: http://target:8000
      type: string
    locustfile:
      default: test/catalog/cases/locust/repo/locustfile.py
      type: string
    spawnRate:
      default: "2"
      type: integer
    users:
      default: "2"
      type: integer
  content:
    git:
      paths:
      - test/catalog/cases/locust/repo
      revision: main
      uri: https://github.com/hinskii/kubetest-alt.git
  use:
  - locust
