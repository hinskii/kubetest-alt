# Sample artillery Test — runs the same project the catalog e2e verifies
# (test/catalog/cases/artillery/repo), sparse-checked out of this repository. It talks to the
# `target` service from target/target.yaml in the same namespace and
# includes deliberate failures; expected phase: passed.
# Swap content.git for your own repository to run real tests.
apiVersion: tests.kubetest.io/v1alpha1
kind: Test
metadata:
  name: sample-artillery
spec:
  config:
    ensure:
      default: "true"
      type: string
    scenario:
      default: test/catalog/cases/artillery/repo/artillery/scenario.yml
      type: string
  content:
    git:
      paths:
      - test/catalog/cases/artillery/repo
      revision: main
      uri: https://github.com/hinskii/kubetest-alt.git
  use:
  - artillery
