# Sample zap-baseline Test — runs the same project the catalog e2e verifies
# (test/catalog/cases/zap-baseline/repo), sparse-checked out of this repository. It talks to the
# `target` service from target/target.yaml in the same namespace and
# includes deliberate failures; expected phase: failed.
# Swap content.git for your own repository to run real tests.
apiVersion: tests.kubetest.io/v1alpha1
kind: Test
metadata:
  name: sample-zap-baseline
spec:
  config:
    spiderMinutes:
      default: "1"
      type: integer
    target:
      default: http://target:8000
      type: string
  content:
    git:
      paths:
      - test/catalog/cases/zap-baseline/repo
      revision: main
      uri: https://github.com/hinskii/kubetest-alt.git
  use:
  - zap-baseline
