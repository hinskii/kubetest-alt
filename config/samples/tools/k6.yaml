# Sample k6 Test — runs the same project the catalog e2e verifies
# (test/catalog/cases/k6/repo), sparse-checked out of this repository. It talks to the
# `target` service from target/target.yaml in the same namespace and
# includes deliberate failures; expected phase: passed.
# Swap content.git for your own repository to run real tests.
apiVersion: tests.kubetest.io/v1alpha1
kind: Test
metadata:
  name: sample-k6
spec:
  config:
    script:
      default: test/catalog/cases/k6/repo/k6/script.js
      type: string
  content:
    git:
      paths:
      - test/catalog/cases/k6/repo
      revision: main
      uri: https://github.com/hinskii/kubetest-alt.git
  use:
  - k6
