apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Apply-test entry point: `kubectl apply -k config/samples/tools/` applies
# every catalog template + one Test per template. Real cluster only —
# samples reference an example git repo (users swap the repo for their
# own).
resources:
  # Session A templates + samples
  - ../../templates/k6.yaml
  - ../../templates/cypress.yaml
  - ../../templates/newman.yaml
  - ../../templates/jmeter.yaml
  - ../../templates/locust.yaml
  - ../../templates/playwright.yaml
  - ../../templates/pytest.yaml
  - k6.yaml
  - cypress.yaml
  - newman.yaml
  - jmeter.yaml
  - locust.yaml
  - playwright.yaml
  - pytest.yaml
  # Session B templates + samples
  - ../../templates/gatling.yaml
  - ../../templates/gradle.yaml
  - ../../templates/maven.yaml
  - ../../templates/artillery.yaml
  - ../../templates/soapui.yaml
  - ../../templates/zap-baseline.yaml
  - ../../templates/cucumber.yaml
  - ../../templates/kubepug.yaml
  - gatling.yaml
  - gradle.yaml
  - maven.yaml
  - artillery.yaml
  - soapui.yaml
  - zap-baseline.yaml
  - cucumber.yaml
  - kubepug.yaml
