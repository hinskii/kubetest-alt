apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One sample Test per catalog template, plus the HTTP target they talk to.
# Templates live outside this directory (kustomize refuses ../ paths), so:
#
#   kubectl apply -n <ns> -f config/templates/
#   kubectl apply -n <ns> -k config/samples/tools/
#   kubectl create -n <ns> -f - <<< '{"apiVersion":"tests.kubetest.io/v1alpha1","kind":"TestRun",
#     "metadata":{"generateName":"sample-k6-"},"spec":{"testRef":"sample-k6"}}'
#
# Each sample sparse-checks out its project from test/catalog/cases/<tool>/repo
# of this repository — the same projects the catalog e2e runs in CI.
resources:
  - target/target.yaml
  - artillery.yaml
  - cucumber.yaml
  - cypress.yaml
  - gatling.yaml
  - gradle.yaml
  - jmeter.yaml
  - k6.yaml
  - kubepug.yaml
  - locust.yaml
  - maven.yaml
  - newman.yaml
  - playwright.yaml
  - pytest.yaml
  - soapui.yaml
  - zap-baseline.yaml
