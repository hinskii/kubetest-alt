# Sample gatling Test — runs the same project the catalog e2e verifies
# (test/catalog/cases/gatling/repo), sparse-checked out of this repository. It talks to the
# `target` service from target/target.yaml in the same namespace and
# includes deliberate failures; expected phase: passed.
# Swap content.git for your own repository to run real tests.
apiVersion: tests.kubetest.io/v1alpha1
kind: Test
metadata:
  name: sample-gatling
spec:
  config:
    simulation:
      default: FixtureSimulation
      type: string
    simulationsFolder:
      default: test/catalog/cases/gatling/repo/gatling/user-files/simulations
      type: string
  content:
    git:
      paths:
      - test/catalog/cases/gatling/repo
      revision: main
      uri: https://github.com/hinskii/kubetest-alt.git
  use:
  - gatling
