---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-tests-kubetest-io-v1alpha1-test
  failurePolicy: Fail
  name: mtest-v1alpha1.kb.io
  rules:
  - apiGroups:
    - tests.kubetest.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tests
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-tests-kubetest-io-v1alpha1-testrun
  failurePolicy: Fail
  name: mtestrun-v1alpha1.kb.io
  rules:
  - apiGroups:
    - tests.kubetest.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - testruns
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-tests-kubetest-io-v1alpha1-test
  failurePolicy: Fail
  name: vtest-v1alpha1.kb.io
  rules:
  - apiGroups:
    - tests.kubetest.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tests
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-tests-kubetest-io-v1alpha1-testrun
  failurePolicy: Fail
  name: vtestrun-v1alpha1.kb.io
  rules:
  - apiGroups:
    - tests.kubetest.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - testruns
  sideEffects: None
