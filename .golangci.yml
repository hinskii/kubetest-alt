version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
        - newexpr
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # goconst flags repeated string literals as "missing constants". In test
      # tables the repetition is intentional (each case is self-contained and
      # readable); extracting names for values like "Allow" or "cron" bloats
      # the tables without improving anything. Production code still gets goconst.
      - linters:
          - goconst
        path: _test\.go$
      # OpenAPI spec is a data DSL — every "get"/"summary"/"responses" is
      # a required JSON key, not a candidate for extraction into a constant.
      # Splitting them out makes the spec's structure unreadable.
      - linters:
          - goconst
        path: internal/apiserver/openapi\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
