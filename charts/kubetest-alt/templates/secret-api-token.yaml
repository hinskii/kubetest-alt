{{- if not .Values.apiserver.auth.existingSecret }}
{{/*
The kubetest API token (fixes.md #1): every API request but the probes and
/metrics must carry it. Generated once and kept across upgrades. Control
Center of this release mounts it; others get it from this Secret
(kubectl get secret … -o jsonpath='{.data.token}' | base64 -d), so who
may call the API is who may read this Secret.
*/}}
{{- $name := include "kubetest-alt.apiToken.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
type: Opaque
data:
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
