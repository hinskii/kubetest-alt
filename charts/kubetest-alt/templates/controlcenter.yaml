{{- if .Values.controlCenter.enabled }}
{{- $cc := .Values.controlCenter }}
{{- $name := include "kubetest-alt.controlCenter.name" . }}
{{- $google := eq $cc.auth.mode "google" }}
{{- if not (has $cc.auth.mode (list "google" "external")) }}
{{- fail (printf "controlCenter.auth.mode %q: must be google or external" $cc.auth.mode) }}
{{- end }}
{{- if $google }}
{{- if not $cc.auth.google.clientID }}{{ fail "controlCenter.auth.google.clientID is required (or set controlCenter.auth.mode=external)" }}{{ end }}
{{- if not $cc.auth.google.existingSecret }}{{ fail "controlCenter.auth.google.existingSecret is required: a Secret with client-secret and cookie-secret" }}{{ end }}
{{- if and (not (include "kubetest-alt.controlCenter.emails" .)) (not $cc.auth.google.allowedDomains) }}
{{- fail "controlCenter: nobody could sign in — set auth.google.allowedEmails, auth.google.allowedDomains or rbac.admins/developers" }}
{{- end }}
{{- end }}
{{- $liveSecret := $cc.liveView.existingSecret | default (printf "%s-live-view" $name) }}
{{- $apiSvc := printf "%s-apiserver" (include "kubetest-alt.fullname" .) }}
{{/*
Control Center configuration. Secrets never go here (CLAUDE.md §0):
the live-view key and the OAuth client come from Secrets.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
data:
  config.yaml: |
    environment: {{ $cc.environment }}
    rbac:
      admins: {{ $cc.rbac.admins | toJson }}
      developers: {{ $cc.rbac.developers | toJson }}
    clusters:
    {{- if $cc.clusters }}
      {{- toYaml $cc.clusters | nindent 6 }}
    {{- else }}
      - name: local
        {{- with $cc.localClusterDisplayName }}
        displayName: {{ . | quote }}
        {{- end }}
        auth: {type: serviceaccount}
        apiServer:
          namespace: {{ .Release.Namespace }}
          service: {{ $apiSvc }}
          port: {{ .Values.apiserver.service.port }}
    {{- end }}
  {{- range $k, $v := $cc.caBundles }}
  ca-{{ $k }}.pem: |
    {{- $v | trim | nindent 4 }}
  {{- end }}
  {{- if $google }}
  # Who may sign in by address (oauth2-proxy --authenticated-emails-file).
  emails: |
    {{- include "kubetest-alt.controlCenter.emails" . | nindent 4 }}
  {{- end }}
{{- if not $cc.liveView.existingSecret }}
---
{{/* Live-view link key: generated once, kept across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $liveSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $liveSecret }}
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
type: Opaque
data:
  key: {{ if $existing }}{{ index $existing.data "key" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
  {{- with .Values.serviceAccounts.controlCenter.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{/*
Control Center reaches this release's API server through the Kubernetes
API service proxy — and nothing else in this cluster: one Service, by name.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames:
      - {{ $apiSvc }}
      - {{ printf "http:%s:%v" $apiSvc .Values.apiserver.service.port }}
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
spec:
  replicas: {{ $cc.replicas }}
  selector:
    matchLabels:
      {{- include "kubetest-alt.controlCenter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubetest-alt.controlCenter.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when its config (roles, clusters, allowed emails) changes.
        checksum/config: {{ toJson $cc | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: control-center
          image: {{ include "kubetest-alt.image" (dict "top" .Values.images "key" "controlCenter" "ctx" .) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --config=/etc/control-center/config.yaml
            {{- if $google }}
            # Only the oauth2-proxy sidecar reaches the UI.
            - --listen=127.0.0.1:8080
            - --email-header=X-Forwarded-Email
            {{- else }}
            - --listen=:8080
            - --email-header={{ $cc.auth.emailHeader }}
            {{- end }}
            - --ops-listen=:9090
          env:
            - name: CC_LIVE_VIEW_KEY
              valueFrom:
                secretKeyRef: {name: {{ $liveSecret }}, key: key}
          ports:
            {{- if not $google }}
            - {name: http, containerPort: 8080, protocol: TCP}
            {{- end }}
            - {name: ops, containerPort: 9090, protocol: TCP}
          readinessProbe:
            httpGet: {path: /readyz, port: ops}
          livenessProbe:
            httpGet: {path: /healthz, port: ops}
          volumeMounts:
            - {name: config, mountPath: /etc/control-center, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml $cc.resources | nindent 12 }}
        {{- if $google }}
        - name: oauth2-proxy
          image: {{ include "kubetest-alt.image" (dict "top" .Values.images "key" "oauth2Proxy" "ctx" .) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --provider=google
            - --client-id={{ $cc.auth.google.clientID }}
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8080/
            - --authenticated-emails-file=/etc/oauth2-proxy/emails
            {{- range $cc.auth.google.allowedDomains }}
            - --email-domain={{ . }}
            {{- end }}
            # The signed-in email reaches Control Center as X-Forwarded-Email;
            # a client-sent one is stripped.
            - --pass-user-headers=true
            - --skip-auth-strip-headers=true
            # Live views are reached by signed link, without a session
            # (docs/security.md).
            - --skip-auth-route=GET=^/live/
            - --reverse-proxy=true
            {{- range $cc.auth.oauth2Proxy.trustedProxyCIDRs }}
            - --trusted-proxy-ip={{ . }}
            {{- end }}
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --skip-provider-button=true
            - --silence-ping-logging=true
            {{- with $cc.ingress.host }}
            - --redirect-url=https://{{ . }}/oauth2/callback
            {{- end }}
            {{- range $cc.auth.oauth2Proxy.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $cc.auth.google.existingSecret }}, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $cc.auth.google.existingSecret }}, key: cookie-secret}
          ports:
            - {name: http, containerPort: 4180, protocol: TCP}
          readinessProbe:
            httpGet: {path: /ping, port: http}
          livenessProbe:
            httpGet: {path: /ping, port: http}
          volumeMounts:
            - name: config
              mountPath: /etc/oauth2-proxy/emails
              subPath: emails
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml $cc.auth.oauth2Proxy.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
spec:
  type: {{ $cc.service.type }}
  ports:
    - {name: http, port: {{ $cc.service.port }}, targetPort: http, protocol: TCP}
    - {name: ops, port: 9090, targetPort: ops, protocol: TCP}
  selector:
    {{- include "kubetest-alt.controlCenter.selectorLabels" . | nindent 4 }}
{{- if $cc.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
  {{- with $cc.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $cc.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $cc.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with $cc.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port: {name: http}
{{- end }}
{{- end }}
