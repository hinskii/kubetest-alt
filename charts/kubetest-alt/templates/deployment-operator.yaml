apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-operator
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "kubetest-alt.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubetest-alt.operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubetest-alt.operator.serviceAccountName" . }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: manager
          image: {{ include "kubetest-alt.image" (dict "top" .Values.images "key" "operator" "ctx" .) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            - --content-fetcher-image={{ include "kubetest-alt.image" (dict "top" .Values.images "key" "contentFetcher" "ctx" .) }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address={{ .Values.operator.metrics.bindAddress }}
            - --metrics-secure={{ .Values.operator.metrics.secure }}
            {{- include "kubetest-alt.storageArgs" . | nindent 12 }}
            {{- if .Values.storage.type }}
            {{- if and (eq .Values.storage.type "s3") .Values.storage.s3.secretName }}
            # Same Secret name must exist in every namespace that runs tests:
            # the wrapper gets it via envFrom.
            - --storage-secret-name={{ .Values.storage.s3.secretName }}
            {{- end }}
            {{- if .Values.operator.logs.enabled }}
            # Pod-log streaming to object storage (§12/§15.4). The binary
            # defaults it off because standalone installs may lack pods/log
            # RBAC; this chart grants that RBAC, so it's on with storage.
            - --logs-enabled
            {{- end }}
            {{- end }}
            {{- if .Values.postgresql.dsn }}
            - --postgres-dsn={{ .Values.postgresql.dsn }}
            {{- end }}
            {{- range .Values.operator.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Operator's own object-storage credentials (result.json reads,
            # log uploads).
            {{- include "kubetest-alt.storageEnv" . | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: webhook-tls
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: webhook-tls
          secret:
            secretName: {{ include "kubetest-alt.fullname" . }}-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-webhook
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  type: ClusterIP
  ports:
    - name: webhook
      port: {{ .Values.webhook.service.port }}
      targetPort: {{ .Values.webhook.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "kubetest-alt.operator.selectorLabels" . | nindent 4 }}
---
{{/* Metrics Service — the manager binds /metrics on :8443. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-metrics
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "kubetest-alt.operator.selectorLabels" . | nindent 4 }}
