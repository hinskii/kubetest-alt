apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-operator
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "kubetest-alt.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubetest-alt.operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubetest-alt.operator.serviceAccountName" . }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: manager
          image: {{ include "kubetest-alt.image" (dict "top" .Values.images "key" "operator" "ctx" .) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            - --content-fetcher-image={{ include "kubetest-alt.image" (dict "top" .Values.images "key" "contentFetcher" "ctx" .) }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address={{ .Values.operator.metrics.bindAddress }}
            - --metrics-secure={{ .Values.operator.metrics.secure }}
            {{- if .Values.minio.endpoint }}
            - --minio-endpoint={{ .Values.minio.endpoint }}
            - --minio-bucket={{ .Values.minio.bucket }}
            {{- if .Values.minio.secretName }}
            - --minio-secret-name={{ .Values.minio.secretName }}
            {{- end }}
            {{- if .Values.minio.useSSL }}
            - --minio-use-ssl
            {{- end }}
            {{- end }}
            {{- if .Values.postgresql.dsn }}
            - --postgres-dsn={{ .Values.postgresql.dsn }}
            {{- end }}
            {{- range .Values.operator.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- if .Values.minio.secretName }}
            # Operator's OWN MinIO client credentials (for result.json
            # download + log-stream upload). Wrapper uses the same Secret
            # via envFrom on the wrapper container — see compiler.
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.secretName }}
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.secretName }}
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: webhook-tls
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: webhook-tls
          secret:
            secretName: {{ include "kubetest-alt.fullname" . }}-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-webhook
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  type: ClusterIP
  ports:
    - name: webhook
      port: {{ .Values.webhook.service.port }}
      targetPort: {{ .Values.webhook.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "kubetest-alt.operator.selectorLabels" . | nindent 4 }}
---
{{/* Metrics Service — the manager binds /metrics on :8443. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-metrics
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "kubetest-alt.operator.selectorLabels" . | nindent 4 }}
