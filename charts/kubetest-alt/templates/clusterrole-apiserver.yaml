{{/*
API server ClusterRole — exactly what internal/apiserver uses, nothing
more. Logs and artifacts come from object storage, so no pods/pods/log.
No TestTriggers / Webhooks: the API server never touches them, and write
access there would let any API caller rewire triggers or exfiltrate run
events (fixes.md #1).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-apiserver-role
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
rules:
  # Tests: GUI CRUD, with §7 managed-by enforcement in the API server.
  - apiGroups: ["tests.kubetest.io"]
    resources: ["tests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # TestRuns: start (create), abort (patch spec.abort), delete from history.
  - apiGroups: ["tests.kubetest.io"]
    resources: ["testruns"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # TestTemplates: read-only, for GET /tests/{name}/resolved.
  - apiGroups: ["tests.kubetest.io"]
    resources: ["testtemplates"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-apiserver-rolebinding
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubetest-alt.fullname" . }}-apiserver-role
subjects:
  - kind: ServiceAccount
    name: {{ include "kubetest-alt.apiserver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
