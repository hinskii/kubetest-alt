{{- if .Values.networkPolicy.enabled -}}
{{/*
Values-gated NetworkPolicy. Restricts ingress to the operator+apiserver
Pods to same-namespace traffic + a labeled Prometheus scraper.
Egress unrestricted (operator talks to the api server, MinIO, Postgres,
webhook endpoints, etc. — the set is user-supplied and pinning it
would create false negatives).
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-restrict
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace }}
      ports:
        - port: 8443
          protocol: TCP
{{- end -}}
