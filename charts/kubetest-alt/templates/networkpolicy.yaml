{{- if .Values.networkPolicy.enabled -}}
{{/*
Values-gated NetworkPolicy. Restricts ingress to the operator+apiserver
Pods to same-namespace traffic + a labeled Prometheus scraper.
Egress unrestricted (operator talks to the api server, object storage, Postgres,
webhook endpoints, etc. — the set is user-supplied and pinning it
would create false negatives).
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-restrict
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    # Not Control Center: it takes traffic from the ingress controller.
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [operator, apiserver]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace }}
      ports:
        - port: 8443
          protocol: TCP
    {{- with .Values.networkPolicy.apiServerProxyCIDRs }}
    # The Kubernetes API server's service proxy — how Control Center
    # reaches the kubetest API server. Its source is a control-plane /
    # node address, not a pod in a namespace.
    - from:
        {{- range . }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
{{- end -}}
