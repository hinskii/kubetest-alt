apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-apiserver
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  replicas: {{ .Values.apiserver.replicas }}
  selector:
    matchLabels:
      {{- include "kubetest-alt.apiserver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubetest-alt.apiserver.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubetest-alt.apiserver.serviceAccountName" . }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: apiserver
          image: {{ include "kubetest-alt.image" (dict "top" .Values.images "key" "apiserver" "ctx" .) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --listen={{ printf ":%d" (int .Values.apiserver.service.port) }}
            {{- with .Values.apiserver.namespace }}
            - --namespace={{ . }}
            {{- end }}
            - --auth-token-file=/var/run/kubetest/api-token/token
            # Same storage flags as the operator — same backend, same bucket.
            {{- include "kubetest-alt.storageArgs" . | nindent 12 }}
            {{- if .Values.postgresql.dsn }}
            - --postgres-dsn={{ .Values.postgresql.dsn }}
            {{- end }}
            {{- range .Values.apiserver.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- include "kubetest-alt.storageEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.apiserver.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: api-token, mountPath: /var/run/kubetest/api-token, readOnly: true}
          resources:
            {{- toYaml .Values.apiserver.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: api-token
          secret:
            secretName: {{ include "kubetest-alt.apiToken.secretName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubetest-alt.fullname" . }}-apiserver
  labels:
    {{- include "kubetest-alt.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.apiserver.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kubetest-alt.apiserver.selectorLabels" . | nindent 4 }}
