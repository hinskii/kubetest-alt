# Default values for kubetest-alt. Override with --set / -f.
#
# The chart ships as a self-contained install: one Deployment for the
# operator (leader-elected), one Deployment + Service for the API
# server, all CRDs, RBAC, webhook certs. Object storage and Postgres are
# external (see `storage` and `postgresql` below).

# Image references. TAGS PIN TO CHART.appVersion by default so a
# single chart bump moves every platform-built image atomically.
# `registry` is prepended to every image (empty = docker hub / ghcr
# paths as-is). Override per-image below when you need to.
images:
  # Common registry prefix. Left empty = images resolve to their
  # published locations (ghcr.io/hinskii/...). Air-gapped clusters
  # override to their mirror and every image follows.
  registry: ""
  pullPolicy: IfNotPresent
  # imagePullSecrets applied to BOTH platform Deployments AND the
  # per-run Pod (via values.pod.imagePullSecrets — merged with
  # per-Test spec.pod.imagePullSecrets, no operator override).
  pullSecrets: []
  #  - name: my-registry-creds

  operator:
    # Overrides the "<registry>/hinskii/kubetest-alt/operator:<appVersion>"
    # default with a specific ref. Bumping images.operator.tag alone
    # (without bumping appVersion) is a stale-pin signal — the helm
    # golden tests flag it, but nothing stops you.
    repository: "ghcr.io/hinskii/kubetest-alt/operator"
    tag: ""  # empty → chart.appVersion
  apiserver:
    repository: "ghcr.io/hinskii/kubetest-alt/apiserver"
    tag: ""
  controlCenter:
    repository: "ghcr.io/hinskii/kubetest-alt/control-center"
    tag: ""
  # The sign-in proxy in front of Control Center (controlCenter.auth.mode
  # google). Pinned: it decides who gets in.
  oauth2Proxy:
    repository: "quay.io/oauth2-proxy/oauth2-proxy"
    tag: "v7.15.5"
  # content-fetcher is what the operator's compiler references via
  # --content-fetcher-image. Bundles /entry — see CLAUDE.md §11.
  contentFetcher:
    repository: "ghcr.io/hinskii/kubetest-alt/content-fetcher"
    tag: ""
  # Three platform-built tool images (CLAUDE.md §3 exception list).
  # Pinned here so a chart install lands a coherent set — every tool
  # template's default image tag is exactly this chart's release.
  gatling:
    repository: "ghcr.io/hinskii/kubetest-alt/gatling"
    tag: "3.9.5"    # empirically pinned in step 15B; independent of appVersion
  soapui:
    repository: "ghcr.io/hinskii/kubetest-alt/soapui"
    tag: "5.7.2"
  kubepug:
    repository: "ghcr.io/hinskii/kubetest-alt/kubepug"
    tag: "1.7.1"

# Leader election defaults ON — the plan mandates it for scheduler +
# TestTrigger dispatcher paths so exactly one replica creates TestRuns.
# Toggle only for single-replica dev clusters where the extra API
# server load isn't worth the safety.
leaderElection:
  enabled: true

# Webhook TLS. Two flavors:
#   - certManager.enabled=false (DEFAULT): helm generates a self-signed
#     Secret via genSelfSignedCert, plumbs caBundle into the Validating/
#     MutatingWebhookConfiguration. This is the DEV DEFAULT so `kind e2e`
#     doesn't need cert-manager installed — the e2e budget is 15 min
#     and cert-manager alone adds 30-60s + moving parts.
#   - certManager.enabled=true: emit a cert-manager Certificate + Issuer,
#     let cert-manager rotate. Production shape.
webhook:
  service:
    port: 443
    targetPort: 9443
  certManager:
    enabled: false
    # Values below only apply when certManager.enabled=true.
    issuerRef:
      # A self-signed cluster issuer is the simplest production
      # fallback; production installs override to a Let's Encrypt /
      # ACME issuer their platform team owns.
      name: kubetest-alt-selfsigned
      kind: ClusterIssuer

operator:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Stream pod logs to object storage while runs execute (needs storage.type).
  # Without it, run logs are never stored — the GUI shows nothing.
  logs:
    enabled: true
  # Extra flags appended to the operator's argv. Common overrides:
  #   - --scheduler-tick-interval=15s
  #   - --trigger-gate-eval-interval=500ms
  extraArgs: []
  # Prometheus /metrics on the manager's endpoint. Kept on HTTPS with
  # controller-runtime's auth filter by default; disable secure to
  # scrape from a Prometheus without ClusterRole for token review.
  metrics:
    bindAddress: ":8443"
    secure: true

# Retention (needs postgresql.dsn): finished runs — history rows, their
# logs/artifacts/results in object storage — and audit entries older than
# this are removed by the operator, hourly, a month at a time. 0 keeps
# everything.
retention:
  days: 30

# Finished TestRuns (needs postgresql.dsn): once a run is in run history,
# its TestRun is deleted from the cluster this long after it finished, so
# etcd doesn't keep every run forever. The run stays in Control Center and
# the API (history, logs, artifacts) until retention. The delay lets
# `kubectl wait` / `kubectl get testrun` read the result first. "0" keeps
# finished TestRuns.
runs:
  finishedTTL: 1h

apiserver:
  replicas: 1
  auth:
    # Secret (key "token", ≥32 characters) with the API token every request
    # must carry (X-Kubetest-Token). Empty = the chart generates one,
    # <release>-kubetest-alt-api-token, kept across upgrades.
    existingSecret: ""
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # Restrict the apiserver to one namespace. Empty (default) = cluster-wide:
  # callers name the namespace per request with ?namespace=.
  namespace: ""
  # Extra flags appended to the apiserver's argv.
  extraArgs: []

# Object storage for logs, artifacts and results — one bucket shared by
# the operator, the API server and every test pod's wrapper (objects live
# under runs/<namespace>/<runUID>/). Empty type = no object storage: no
# artifacts, no stored logs, verdicts from pod state only.
storage:
  # "s3" (any S3-compatible store: AWS S3, MinIO, Ceph, R2, …) or "gcs".
  type: ""
  bucket: "kubetest-artifacts"
  s3:
    # host[:port], no scheme. Empty = AWS S3.
    endpoint: ""
    useSSL: true
    region: ""
    # Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY. It must exist
    # in the release namespace (operator + API server) AND in every
    # namespace that runs tests (the wrapper gets it via envFrom). Empty =
    # the AWS credential chain everywhere (e.g. IRSA on EKS).
    secretName: ""
  gcs:
    # Emulators only (fake-gcs-server); disables authentication. Real GCS
    # uses Application Default Credentials: Workload Identity — annotate
    # serviceAccounts.*.annotations below, and give test pods a Kubernetes
    # service account bound to a Google one (spec.pod.serviceAccountName,
    # e.g. via a TestTemplate).
    endpoint: ""

# Annotations for the operator's and API server's ServiceAccounts — e.g.
# iam.gke.io/gcp-service-account: kubetest@PROJECT.iam.gserviceaccount.com
# (GCS via Workload Identity) or eks.amazonaws.com/role-arn (S3 via IRSA).
serviceAccounts:
  operator:
    annotations: {}
  apiserver:
    annotations: {}
  controlCenter:
    annotations: {}   # e.g. Workload Identity for clusters with auth gcp

# Postgres wiring. Empty DSN + disabled subchart = no run-history
# persistence — the reconciler runs correct but archived-runs listing
# in the API server returns cluster-only entries.
postgresql:
  enabled: false
  dsn: ""

# Optional NetworkPolicy. Defaults OFF. When enabled, denies ingress
# except from the same namespace + Prometheus scraper (label-selected).
networkPolicy:
  enabled: false
  prometheusNamespace: "monitoring"
  # Control Center reaches the API server through the Kubernetes API
  # service proxy; with the policy on, admit the control plane's address
  # range here (e.g. the GKE master CIDR), or Control Center can't connect.
  apiServerProxyCIDRs: []

# Control Center — the web UI (docs/control-center.md). Off by default.
controlCenter:
  enabled: false
  replicas: 1
  # production refuses development-only settings (kubeconfig clusters,
  # devUser).
  environment: production
  # Local development only (environment: development, auth.mode:
  # external): act as this email when no sign-in header is present — no
  # proxy, no Google. The chart refuses it in production.
  devUser: ""
  # Roles by email; anyone else signed in is a viewer.
  rbac:
    admins: []       # + delete runs, cleanup
    developers: []   # + run, abort, comment, schedule
  # Clusters this Control Center manages (config format: docs/control-center.md).
  # Empty = only the kubetest of this release, as "local".
  clusters: []
  localClusterDisplayName: ""
  # API tokens of remote clusters' kubetest (Secret names, key "token"),
  # by cluster name: each lands at /var/run/kubetest/tokens/<name>/token
  # for that cluster's apiServer.tokenFile. This release's own is mounted
  # for the default "local" cluster.
  apiTokenSecrets: {}
  # CA bundles (PEM) of remote clusters' API servers, by name: each lands
  # at /etc/control-center/ca-<name>.pem for a cluster's caFile.
  caBundles: {}
  auth:
    # google: an oauth2-proxy sidecar signs people in with Google and lets
    #   in only allowedEmails, allowedDomains and the rbac lists. Control
    #   Center listens on localhost, so the proxy is the only way in.
    # external: you put the sign-in in front (e.g. oauth2-proxy behind the
    #   ingress, auth_request) and it sets emailHeader. It MUST strip that
    #   header from client requests, and nothing else may reach the pod.
    mode: google
    google:
      # OAuth client (Google Cloud Console → Credentials → OAuth client ID,
      # type Web application, redirect URI https://<ingress.host>/oauth2/callback).
      clientID: ""
      # Secret with keys client-secret and cookie-secret (32 random bytes,
      # base64: openssl rand -base64 32 | tr -- '+/' '-_').
      existingSecret: ""
      # Who may sign in. rbac.admins and rbac.developers are always allowed.
      allowedEmails: []
      # Whole Google Workspace domains, e.g. [firma.pl].
      allowedDomains: []
    # external mode: the header carrying the email.
    emailHeader: X-Auth-Request-Email
    oauth2Proxy:
      # Addresses allowed to send X-Forwarded-For/-Proto/-Host (your
      # ingress controller's pod CIDR). Empty trusts every source for
      # those — not for the email, which oauth2-proxy always sets itself.
      trustedProxyCIDRs: []
      # Extra oauth2-proxy flags (another provider, cookie settings, …).
      extraArgs: []
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 200m, memory: 128Mi}
  liveView:
    # Secret (key "key") signing live-view links; empty = the chart keeps
    # one of its own, stable across upgrades and shared by all replicas.
    existingSecret: ""
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    # e.g. [{secretName: kubetest-tls, hosts: [kubetest.example.com]}]
    tls: []
  resources:
    requests: {cpu: 20m, memory: 48Mi}
    limits: {cpu: 500m, memory: 256Mi}

# What test pods may ask for (spec.pod / spec.container, fixes.md #1). The
# operator checks every run's resolved spec (templates included); the
# admission webhooks refuse Tests and TestRuns that break it.
testPods:
  # Service accounts besides "default" (e.g. one bound to a Google service
  # account for GCS). Names apply in every namespace.
  allowedServiceAccounts: []
  # hostPath volumes give a test the node's filesystem.
  allowHostPath: false
